name: Desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: read

  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release.mjs prepare

  build:
    needs: prepare
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: write
    with:
      release: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    concurrency:
      group: desktop-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify complete downloads, checksum and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release.mjs publish
