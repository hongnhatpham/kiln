name: Desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_COMPRESSION_LEVEL: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Linux package tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: pnpm package
      - run: pnpm agent fixture --out artifacts/fixture.glb
      - name: Verify Windows install and update
        if: matrix.platform == 'windows'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -ExecutablePath release/Kiln-Windows-x64-Portable.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -ExecutablePath release/Kiln-Windows-x64-Portable.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = Start-Process -FilePath ./release/Kiln-Windows-x64-Setup.exe -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode) { exit $setup.ExitCode }
      - name: Exercise packaged Windows app
        if: matrix.platform == 'windows'
        run: |
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path ([Environment]::GetFolderPath('Programs')) 'Kiln.lnk'))
          if (-not (Test-Path (Join-Path (Split-Path $shortcut.TargetPath) 'resources/app.asar'))) { throw 'Installed application or menu shortcut is missing.' }
          pnpm agent smoke --input artifacts/fixture.glb --out artifacts/smoke --executable $shortcut.TargetPath
      - name: Verify macOS install and update
        if: matrix.platform == 'macos'
        run: |
          mkdir -p artifacts/local-release
          cp release/Kiln-macOS-${{ matrix.arch }}.zip artifacts/local-release/
          (cd artifacts/local-release && shasum -a 256 *.zip > SHA256SUMS.txt)
          sed "s|^release_url=.*|release_url=file://$GITHUB_WORKSPACE/artifacts/local-release|" install.sh > artifacts/install-local.sh
          sh artifacts/install-local.sh
          sh artifacts/install-local.sh
      - name: Exercise packaged macOS app
        if: matrix.platform == 'macos'
        run: pnpm agent smoke --input artifacts/fixture.glb --out artifacts/smoke --executable "$HOME/Applications/Kiln.app/Contents/MacOS/Kiln"
      - name: Install Linux package with sandbox enabled
        if: matrix.platform == 'linux'
        run: |
          mkdir -p artifacts/local-release
          cp release/Kiln-Linux-x64.deb artifacts/local-release/
          (cd artifacts/local-release && sha256sum *.deb > SHA256SUMS.txt)
          sed "s|^release_url=.*|release_url=file://$GITHUB_WORKSPACE/artifacts/local-release|" install.sh > artifacts/install-local.sh
          sh artifacts/install-local.sh
          sh artifacts/install-local.sh
          test -f /usr/share/applications/kiln.desktop
          ! grep -q -- '--no-sandbox' /usr/share/applications/kiln.desktop
      - name: Exercise installed Linux app
        if: matrix.platform == 'linux'
        run: xvfb-run -a pnpm agent smoke --input artifacts/fixture.glb --out artifacts/smoke --executable /opt/Kiln/kiln
      - uses: actions/upload-artifact@v4
        with:
          name: Kiln-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/Kiln-*.exe
            release/Kiln-*.zip
            release/Kiln-*.dmg
            release/Kiln-*.deb
            release/Kiln-*.rpm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/smoke
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Kiln-*
          path: release
          merge-multiple: true
      - name: Prepare verified downloads
        run: |
          cp install.sh install.ps1 release/
          cp resources/kiln.png release/Kiln.png
          cd release
          sha256sum Kiln-* Kiln.png install.sh install.ps1 > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Kiln $GITHUB_REF_NAME" --notes-file docs/release-notes.md
